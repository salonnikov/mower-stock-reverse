# chip2 — замер амплитуды сигнала катушки границы (ТОЛЬКО ЧТЕНИЕ, halt->read->resume).
# Читает signed-буферы АЦП, что chip2 сравнивает с порогом |sample|>2500, и печатает пик.
# Условия: косилка на ЗАВОДСКОЙ прошивке (chip2 сэмплит), база ВКЛ (провод под сигналом),
#          катушка поднесена к проводу периметра.
# ★ ПИНЫ chip2 (Pi 2B J8): SWCLK=GPIO8 (пин24), SWDIO=GPIO7 (пин26), GND=пин25 → swd_nums 8 7.
#   (chip1 отдельным жгутом на GPIO25/24 + GND пин6. НЕ путать — все старые cfg на 25/24 = chip1.)
#
# Цепочка адресов (разрезолвлено из дампа, 2026-07-13):
#   глобал-структура сенсора  = 0x20000078
#   OBJ (объект сенсора)      = read32(0x20000078 + 4) = read32(0x2000007c)
#   count (u16 сэмплов, 800/235) = read16(OBJ + 0x92)
#   левый  канал буфер (ptr на int16[count]) = read32(OBJ + 0x48)
#   правый канал буфер (ptr на int16[count]) = read32(OBJ + 0x68)
# Порог детекции в прошивке: |sample| > 2500 (0x9c4), strong-режим 5000.

adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 8 7
transport select swd
adapter speed 200
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
init
halt

proc peak_abs {ptr count} {
    set maxabs 0
    set at 0
    # читаем count 16-битных слов начиная с ptr
    mem2array buf 16 $ptr $count
    for {set i 0} {$i < $count} {incr i} {
        set v $buf($i)
        if {$v >= 32768} { set v [expr {$v - 65536}] }  ;# в знаковое
        set a [expr {abs($v)}]
        if {$a > $maxabs} { set maxabs $a; set at $i }
    }
    return [list $maxabs $at]
}

if {[catch {
    mem2array g 32 0x2000007c 1
    set obj $g(0)
    echo [format "OBJ(sensor) = 0x%08x" $obj]
    if {$obj == 0 || $obj < 0x20000000 || $obj > 0x20020000} {
        echo "!! OBJ вне SRAM — прошивка не заводская / сенсор не инициализирован. Прекращаю."
    } else {
        mem2array c 16 [expr {$obj + 0x92}] 1
        set count $c(0)
        mem2array lp 32 [expr {$obj + 0x48}] 1
        mem2array rp 32 [expr {$obj + 0x68}] 1
        set left  $lp(0)
        set right $rp(0)
        echo [format "count=%d  left_buf=0x%08x  right_buf=0x%08x" $count $left $right]
        if {$count > 0 && $count <= 800 && $left != 0} {
            set pl [peak_abs $left $count]
            echo [format "LEFT  peak|sample| = %d  @idx %d   (порог 2500)" [lindex $pl 0] [lindex $pl 1]]
        } else { echo "LEFT буфер не готов" }
        if {$count > 0 && $count <= 800 && $right != 0} {
            set pr [peak_abs $right $count]
            echo [format "RIGHT peak|sample| = %d  @idx %d   (порог 2500)" [lindex $pr 0] [lindex $pr 1]]
        } else { echo "RIGHT буфер не готов" }
        # сырой снимок буферов в файлы для оффлайн-анализа формы волны
        if {$left  != 0} { catch {dump_image /home/pi/mower-swd/coil_left.bin  $left  [expr {$count*2}]} }
        if {$right != 0} { catch {dump_image /home/pi/mower-swd/coil_right.bin $right [expr {$count*2}]} }
    }
} e]} { echo "READ ERR: $e" }

resume
echo "--- coil read done, resumed ---"
shutdown
