# chip1 — чтение батареи + FSM-состояния (ТОЛЬКО ЧТЕНИЕ, halt->read->resume).
# Заводская прошивка. DMA-буфер ADC0 пакета @0x2000bb34 (RL=5, 16-бит/ранг):
#   rank0 = PC5 пак (raw) → pack_mV = raw*5.4277
#   rank1 = ток, rank3 = OCV, rank2 = темп, rank4 = Vref
# FSM state @0x200000bc: 3=idle/unlock 4=departure 5=cutting 8=batt-low 9=move/search 10=docked/charge
# ПИНЫ chip1: SWCLK=GPIO25 (пин22), SWDIO=GPIO24 (пин18), GND пин6 → swd_nums 25 24.
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 200
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
init
halt

if {[catch {
    mem2array adc 16 0x2000bb34 5
    set r0 $adc(0); set r1 $adc(1); set r2 $adc(2); set r3 $adc(3); set r4 $adc(4)
    set pack_mv [expr {$r0 * 5.4277}]
    set ocv_mv  [expr {$r3 * 5.4277}]
    echo [format "ADC ranks: r0(pack)=%d r1(ток)=%d r2(темп)=%d r3(OCV)=%d r4(Vref)=%d" $r0 $r1 $r2 $r3 $r4]
    echo [format "PACK  = %.0f мВ (%.2f В)   raw=0x%04x" $pack_mv [expr {$pack_mv/1000.0}] $r0]
    echo [format "OCV   = %.0f мВ   ток_raw=%d" $ocv_mv $r1]
    mem2array fsm 32 0x200000bc 1
    echo [format "FSM state = %d  (3=idle 4=departure 5=cutting 8=batt-low 9=move/search 10=docked/charge)" $fsm(0)]
} e]} { echo "READ ERR: $e" }

resume
echo "--- batt read done, resumed ---"
shutdown
