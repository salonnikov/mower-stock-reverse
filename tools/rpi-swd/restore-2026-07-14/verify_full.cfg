# verify_full.cfg (2026-07-14) — READ ONLY. Verify all 4 regions after
# the full rollback = factory. halt -> read -> resume. No reset.
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 200
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
if {[catch {
    mem2array v  32 0x08018000 2
    mem2array hk 32 0x08053b0c 2
    mem2array pl 32 0x08090000 1
    mem2array cr 32 0x080ffffc 1
    echo [format "SP=0x%08x RST=0x%08x  hook=0x%08x/0x%08x  payload=0x%08x  CRC=0x%08x" \
          $v(0) $v(1) $hk(0) $hk(1) $pl(0) $cr(0)]
    set ok 1
    if {$v(0)  != 0x20017ff8} { set ok 0; echo "  FAIL: SP not factory (app low)" }
    if {$v(1)  != 0x08018441} { set ok 0; echo "  FAIL: RESET not factory" }
    if {$hk(0) != 0xf02f4668} { set ok 0; echo "  FAIL: hook not factory (page 0x53800)" }
    if {$hk(1) != 0x6860fdbd} { set ok 0; echo "  FAIL: hook+4 not factory" }
    if {$pl(0) != 0xffffffff} { set ok 0; echo "  FAIL: payload 0x90000 not erased" }
    if {$cr(0) != 0x0f69a878} { set ok 0; echo "  FAIL: CRC not factory" }
    if {$ok} {
        echo ">>> OK: ALL 4 regions = FACTORY. Flash clean. Physical POWER-CYCLE of the mower is OK now."
    } else {
        echo ">>> WARNING: not everything matched — do NOT power off / do not boot, investigate."
    }
} e]} { echo "READ ERR: $e" }
resume
echo "--- verify_full done, resumed ---"
shutdown
