# flash_factory_restore_3page.cfg  (2026-07-14)
# ВОССТАНОВЛЕНИЕ ЗАВОДА для chip1 (GD32F305) — 3 страницы app: 0x08018000..0x080197FF.
# Записывает ЗАВОДСКИЕ байты (из dist/gd32-mainboard-dump-v1.bin) байт-в-байт.
# Покрывает МАКСИМАЛЬНЫЙ регион, который трогали наши флешеры (testO стёр 3 стр.).
# ПРЕДУСЛОВИЕ (проверить chip1-identify.cfg ПЕРЕД заливкой):
#   - CRC @0x080ffffc == 0x0f69a878 (завод, bank1 не трогали)
#   - hook @0x08053b0e == заводское (не RC-инъекция)
#   - payload @0x08090000 == 0xffffffff (bank1 чист)
#   Если что-то из этого НЕ так — этот 3-стр. restore НЕ полон, нужен расширенный.
# После заливки: НЕ reset run — только физический POWER-CYCLE косилки.
# Пины chip1: SWCLK=GPIO25(pin22) SWDIO=GPIO24(pin18) GND(pin6). swd_nums 25 24.
# ============================================================================
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
poll off
halt
