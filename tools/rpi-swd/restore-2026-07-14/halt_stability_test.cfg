# ============================================================================
# halt_stability_test.cfg (2026-07-14) — SAFE test before flashing.
# The board reboots continuously. We check: if we catch the core, halt it and
# freeze the watchdog — does the reboot loop freeze (halt holds without resets)?
# WRITES NOTHING TO FLASH. Only halt + reading DHCSR.
#   DHCSR @0xE000EDF0: S_HALT=bit17(0x20000), S_RESET_ST=bit25(0x2000000, sticky-read-clear).
#   Stable = S_HALT stays 1 and S_RESET_ST=0 on every poll (no resets).
# ============================================================================
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
mww 0xE0042004 0x00000300
echo ">>> CAUGHT+HALTED, wdg frozen. Watching for 15s (hold the button)."
set resets 0
for {set i 1} {$i <= 15} {incr i} {
    sleep 1000
    if {[catch {
        mem2array d 32 0xE000EDF0 1
        set halted [expr {($d(0) & 0x00020000) ? 1 : 0}]
        set rst    [expr {($d(0) & 0x02000000) ? 1 : 0}]
        if {$rst} { incr resets }
        echo [format "t=%02d DHCSR=0x%08x  S_HALT=%d  RESET_since_last=%d" $i $d(0) $halted $rst]
    } err]} {
        echo [format "t=%02d LOST target: %s" $i $err]
        incr resets
    }
}
if {$resets == 0} {
    echo ">>> STABLE: halt holds, no resets. FLASHING IS SAFE (no time limit)."
} else {
    echo [format ">>> UNSTABLE: %d reset(s) during halt = external reset source. Do NOT flash blindly!" $resets]
}
resume
echo "--- halt stability test done ---"
shutdown
