# ============================================================================
# chip1-identify.cfg  (2026-07-14)  — ТОЛЬКО ЧТЕНИЕ. halt -> read -> resume.
# Отвечает на 2 вопроса:
#   1) ЕСТЬ ЛИ СВЯЗЬ по SWD (DPIDR/CPUID живые, не deadbeef/0).
#   2) КАКАЯ прошивка на chip1 (ЗАВОД vs НАША) + не тронуты ли высокие регионы,
#      чтобы решить, хватит ли 3-страничного отката на завод.
# Пины chip1: SWCLK=GPIO25(pin22) SWDIO=GPIO24(pin18) GND(pin6).  swd_nums 25 24.
# Ничего НЕ пишет и НЕ стирает. Безопасно.
#
# Эталоны (little-endian):
#   app SP  @0x08018000 : ЗАВОД=0x20017ff8   НАШ=0x20018000
#   reset   @0x08018004 : ЗАВОД=0x08018441   НАШ=0x080181c9
#   page3   @0x08019000 : ЗАВОД=0xf04f461c   testO=0x080192b8
#   hook    @0x08053b0c : ЗАВОД=0xf02f4668  @0x08053b10: ЗАВОД=0x6860fdbd
#   payload @0x08090000 : ЗАВОД=0xffffffff (чисто)
#   CRC     @0x080ffffc : ЗАВОД=0x0f69a878
# ============================================================================
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 200
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt

if {[catch {
    mem2array cid 32 0xE000ED00 1
    mem2array dbg 32 0xE0042000 1
    mem2array obr 32 0x4002201C 1
    echo [format "LINK: CPUID=0x%08x  DBG_ID=0x%08x  FMC_OBR=0x%08x (bit1=RDP)" $cid(0) $dbg(0) $obr(0)]

    mem2array v 32 0x08018000 2
    set sp $v(0); set rst $v(1)
    echo [format "APP VEC @0x08018000: SP=0x%08x  RESET=0x%08x" $sp $rst]
    if {$sp == 0x20017ff8} {
        echo ">>> ПРОШИВКА = ЗАВОДСКАЯ (SP совпал с заводом)"
    } elseif {$sp == 0x20018000} {
        echo ">>> ПРОШИВКА = НАША own_fw (SP=0x20018000). Косилка грузит наш app."
    } else {
        echo ">>> ПРОШИВКА = НЕИЗВЕСТНАЯ (SP не совпал ни с заводом, ни с нашим!)"
    }

    mem2array p3 32 0x08019000 1
    echo [format "PAGE3 @0x08019000 = 0x%08x  (ЗАВОД=0xf04f461c, testO=0x080192b8)" $p3(0)]

    mem2array hk 32 0x08053b0c 2
    echo [format "HOOK  @0x08053b0c = 0x%08x  @0x08053b10 = 0x%08x  (ЗАВОД=0xf02f4668 / 0x6860fdbd)" $hk(0) $hk(1)]
    if {$hk(0) == 0xf02f4668 && $hk(1) == 0x6860fdbd} {
        echo "    hook = ЗАВОД (RC-инъекции нет)"
    } else {
        echo "    !!! hook ИЗМЕНЁН — возможна RC-инъекция, 3-стр. откат НЕ полон"
    }

    mem2array pl 32 0x08090000 1
    echo [format "PAYLOAD @0x08090000 = 0x%08x  (ЗАВОД=0xffffffff чисто)" $pl(0)]
    if {$pl(0) != 0xffffffff} { echo "    !!! bank1 payload НЕ чист — нужен расширенный откат" }

    mem2array crc 32 0x080ffffc 1
    echo [format "APP CRC @0x080ffffc = 0x%08x  (ЗАВОД=0x0f69a878)" $crc(0)]
    if {$crc(0) != 0x0f69a878} { echo "    !!! CRC ИЗМЕНЁН (bank1 трогали) — 3-стр. откат НЕ полон" }

    echo "----------------------------------------------------------------"
    echo "ВЫВОД: если PAGE3/hook/payload/CRC = ЗАВОД, а SP=НАШ — тронуты ТОЛЬКО"
    echo "       3 младшие страницы -> flash_factory_restore_3page.cfg = точный откат."
} e]} { echo "READ ERR (возможно косилка спит / нет питания / RDP): $e" }

resume
echo "--- identify done, resumed ---"
shutdown
