# ============================================================================
# chip1-identify.cfg  (2026-07-14)  — READ ONLY. halt -> read -> resume.
# Answers 2 questions:
#   1) IS THERE A LINK over SWD (DPIDR/CPUID alive, not deadbeef/0).
#   2) WHICH firmware is on chip1 (FACTORY vs OURS) + whether the high regions are untouched,
#      to decide whether a 3-page rollback to factory is enough.
# chip1 pins: SWCLK=GPIO25(pin22) SWDIO=GPIO24(pin18) GND(pin6).  swd_nums 25 24.
# Writes nothing and erases nothing. Safe.
#
# References (little-endian):
#   app SP  @0x08018000 : FACTORY=0x20017ff8   OURS=0x20018000
#   reset   @0x08018004 : FACTORY=0x08018441   OURS=0x080181c9
#   page3   @0x08019000 : FACTORY=0xf04f461c   testO=0x080192b8
#   hook    @0x08053b0c : FACTORY=0xf02f4668  @0x08053b10: FACTORY=0x6860fdbd
#   payload @0x08090000 : FACTORY=0xffffffff (clean)
#   CRC     @0x080ffffc : FACTORY=0x0f69a878
# ============================================================================
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 200
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt

if {[catch {
    mem2array cid 32 0xE000ED00 1
    mem2array dbg 32 0xE0042000 1
    mem2array obr 32 0x4002201C 1
    echo [format "LINK: CPUID=0x%08x  DBG_ID=0x%08x  FMC_OBR=0x%08x (bit1=RDP)" $cid(0) $dbg(0) $obr(0)]

    mem2array v 32 0x08018000 2
    set sp $v(0); set rst $v(1)
    echo [format "APP VEC @0x08018000: SP=0x%08x  RESET=0x%08x" $sp $rst]
    if {$sp == 0x20017ff8} {
        echo ">>> FIRMWARE = FACTORY (SP matched factory)"
    } elseif {$sp == 0x20018000} {
        echo ">>> FIRMWARE = OURS own_fw (SP=0x20018000). The mower boots our app."
    } else {
        echo ">>> FIRMWARE = UNKNOWN (SP matched neither factory nor ours!)"
    }

    mem2array p3 32 0x08019000 1
    echo [format "PAGE3 @0x08019000 = 0x%08x  (FACTORY=0xf04f461c, testO=0x080192b8)" $p3(0)]

    mem2array hk 32 0x08053b0c 2
    echo [format "HOOK  @0x08053b0c = 0x%08x  @0x08053b10 = 0x%08x  (FACTORY=0xf02f4668 / 0x6860fdbd)" $hk(0) $hk(1)]
    if {$hk(0) == 0xf02f4668 && $hk(1) == 0x6860fdbd} {
        echo "    hook = FACTORY (no RC injection)"
    } else {
        echo "    !!! hook CHANGED — possible RC injection, 3-page rollback is NOT complete"
    }

    mem2array pl 32 0x08090000 1
    echo [format "PAYLOAD @0x08090000 = 0x%08x  (FACTORY=0xffffffff clean)" $pl(0)]
    if {$pl(0) != 0xffffffff} { echo "    !!! bank1 payload NOT clean — an extended rollback is needed" }

    mem2array crc 32 0x080ffffc 1
    echo [format "APP CRC @0x080ffffc = 0x%08x  (FACTORY=0x0f69a878)" $crc(0)]
    if {$crc(0) != 0x0f69a878} { echo "    !!! CRC CHANGED (bank1 touched) — 3-page rollback is NOT complete" }

    echo "----------------------------------------------------------------"
    echo "CONCLUSION: if PAGE3/hook/payload/CRC = FACTORY and SP=OURS — ONLY"
    echo "       the 3 low pages were touched -> flash_factory_restore_3page.cfg = exact rollback."
} e]} { echo "READ ERR (mower may be asleep / no power / RDP): $e" }

resume
echo "--- identify done, resumed ---"
shutdown
