# verify_after.cfg (2026-07-14) — ТОЛЬКО ЧТЕНИЕ. Проверка, что 3 страницы app
# восстановлены до ЗАВОДА. halt -> read -> resume. Без reset.
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 200
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
if {[catch {
    mem2array v 32 0x08018000 2
    mem2array p3 32 0x08019000 1
    mem2array e 32 0x080197fc 1
    echo [format "SP=0x%08x RESET=0x%08x  (ЗАВОД: 0x20017ff8 / 0x08018441)" $v(0) $v(1)]
    echo [format "PAGE3 @0x08019000=0x%08x  END @0x080197fc=0x%08x  (ЗАВОД: 0xf04f461c / ...)" $p3(0) $e(0)]
    if {$v(0)==0x20017ff8 && $v(1)==0x08018441 && $p3(0)==0xf04f461c} {
        echo ">>> OK: 3 страницы = ЗАВОД. Можно физический POWER-CYCLE косилки."
    } else {
        echo ">>> ВНИМАНИЕ: не совпало с заводом — НЕ грузить, разбираться."
    }
} e]} { echo "READ ERR: $e" }
resume
echo "--- verify done, resumed ---"
shutdown
