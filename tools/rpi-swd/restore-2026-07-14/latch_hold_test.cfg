# ============================================================================
# latch_hold_test.cfg (2026-07-14) — ТЕСТ удержания защёлки питания по SWD.
# Ловит chip1 (halt), выставляет power-latch GPIO HIGH напрямую по SWD:
#   PE12 (главная защёлка) + PE7 (aux-рейл) + PB0 (вторичная).
# Затем 25с мониторит, жив ли чип. Идея: если после отпускания кнопки DPIDR
# остаётся живым — питание держится нашей защёлкой -> можно лить откат.
# НИЧЕГО НЕ ПИШЕТ ВО ФЛЕШ. Только GPIO-регистры + чтение.
#
# Регистры (GD32F30x, из factory-map/01-boot-poweron):
#   RCU APB2EN = 0x40021018 (GPIOB бит3=0x603, GPIOE бит6=0x606, AFIO бит0)
#   GPIOB base 0x40010c00: CTL0=+0x00 OCTL=+0x0c BOP=+0x10   (PB0)
#   GPIOE base 0x40011800: CTL0=+0x00 CTL1=+0x04 OCTL=+0x0c BOP=+0x10 (PE7 в CTL0, PE12 в CTL1)
#   OUT-PP 50MHz = нибль 0x3.  BOP: бит N -> пин N в HIGH.
# ============================================================================
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
mww 0xE0042004 0x00000300

# --- включить клоки GPIOB+GPIOE+AFIO (idempotent RMW APB2EN) ---
mem2array ab 32 0x40021018 1
mww 0x40021018 [expr {$ab(0) | 0x00000049}]

# --- PB0 -> OUT-PP (CTL0 нибль пина0 = биты 0..3) ---
mem2array bc 32 0x40010c00 1
mww 0x40010c00 [expr {($bc(0) & 0xFFFFFFF0) | 0x00000003}]

# --- PE7 -> OUT-PP (GPIOE CTL0 нибль пина7 = биты 28..31) ---
mem2array ec0 32 0x40011800 1
mww 0x40011800 [expr {($ec0(0) & 0x0FFFFFFF) | 0x30000000}]

# --- PE12 -> OUT-PP (GPIOE CTL1 нибль пина12 = биты 16..19) ---
mem2array ec1 32 0x40011804 1
mww 0x40011804 [expr {($ec1(0) & 0xFFF0FFFF) | 0x00030000}]

# --- выставить HIGH через BOP: PE12(бит12)+PE7(бит7)=0x1080, PB0(бит0)=0x1 ---
mww 0x40011810 0x00001080
mww 0x40010c10 0x00000001
echo ">>> ASSERTED PE12/PE7/PB0 HIGH (защёлка выставлена). ОТПУСКАЙ КНОПКУ."

# --- мониторинг 25с: жив ли чип после отпускания кнопки ---
for {set i 1} {$i <= 25} {incr i} {
    sleep 1000
    if {[catch {mem2array c 32 0xE000ED00 1} err]} {
        echo [format "t=%02d DEAD (питание упало): %s" $i $err]
        break
    } else {
        echo [format "t=%02d ALIVE cpuid=0x%08x" $i $c(0)]
    }
}
echo "--- latch-hold test done ---"
shutdown
