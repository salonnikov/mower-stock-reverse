# read_fsm_batt.cfg (2026-07-14) — READ ONLY. Catches+halts+freezes wdg, then
# samples the FSM state and battery/pack during boot (6 times, resume 300ms between).
# Factory addresses: ADC DMA @0x2000bb34 (r0 pack,r1 current,r2 temp,r3 OCV,r4 Vref),
# FSM @0x200000bc (3=idle 4=departure 5=cutting 8=batt-low 9=move/search 10=docked/charge).
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
mww 0xE0042004 0x00000300
echo ">>> HALTED, sampling boot (FSM+pack) 6x..."
for {set s 1} {$s <= 6} {incr s} {
    if {[catch {
        mem2array adc 16 0x2000bb34 5
        mem2array fsm 32 0x200000bc 1
        set pack [expr {$adc(0) * 5.4277}]
        echo [format "s%d: FSM=%d  pack=%.0fmV(raw=%d) current=%d temp=%d OCV=%d Vref=%d" \
              $s $fsm(0) $pack $adc(0) $adc(1) $adc(2) $adc(3) $adc(4)]
    } e]} { echo [format "s%d READ/stopped: %s" $s $e] }
    resume
    sleep 300
    if {[catch {halt} e]} { echo [format "s%d halt fail (board went off?): %s" $s $e]; break }
}
echo "--- fsm/batt sampling done ---"
resume
shutdown
