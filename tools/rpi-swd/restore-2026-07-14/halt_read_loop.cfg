# halt_read_loop.cfg (2026-07-14) — READ ONLY. Catches the core, HALTS it (reboot freezes),
# and reads the firmware once every ~15s (3 cycles ~45s). Writes nothing to flash.
# While you hold the button — chip1 is powered, halt keeps it stable.
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
mww 0xE0042004 0x00000300
echo ">>> HALTED, reboot frozen. Reading firmware 3x every 15s (hold the button)."
for {set c 1} {$c <= 3} {incr c} {
    if {[catch {
        mem2array v  32 0x08018000 2
        mem2array hk 32 0x08053b0c 1
        mem2array pl 32 0x08090000 1
        mem2array cr 32 0x080ffffc 1
        set fw "?"
        if {$v(0)==0x20017ff8} { set fw "FACTORY" }
        if {$v(0)==0x20018000} { set fw "OURS own_fw(testO)" }
        echo [format "cycle %d: SP=0x%08x fw=%s  hook=0x%08x  payload=0x%08x  CRC=0x%08x" \
              $c $v(0) $fw $hk(0) $pl(0) $cr(0)]
    } e]} { echo [format "cycle %d READ ERR: %s" $c $e] }
    if {$c < 3} { sleep 15000 }
}
echo "--- halt-read loop done ---"
resume
shutdown
