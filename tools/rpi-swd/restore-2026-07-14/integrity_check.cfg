# integrity_check.cfg (2026-07-14) — READ ONLY. Catches+halts+freezes wdg,
# reads 30 points across the whole app region and compares with the factory dump.
# All match = flash clean (it's the hardware/conditions). A mismatch = the culprit region.
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
mww 0xE0042004 0x00000300
echo ">>> HALTED, checking integrity of 30 points..."
set pairs {
  {0x08018000 0x20017ff8}
  {0x0801c000 0x4026f851}
  {0x08020000 0x41f0e92d}
  {0x08024000 0xfb67f7f4}
  {0x08028000 0x684e34ff}
  {0x0802c000 0x2c656761}
  {0x08030000 0x5ff0e92d}
  {0x08034000 0x656c2065}
  {0x08038000 0x47806d80}
  {0x0803c000 0x69616620}
  {0x08040000 0x735c2e2e}
  {0x08044000 0x63207962}
  {0x08048000 0xf0001003}
  {0x0804c000 0x9a20ee82}
  {0x08050000 0x64faf44f}
  {0x08054000 0xd10a2d01}
  {0x08058000 0x7506463b}
  {0x0805c000 0xd02a07c0}
  {0x08060000 0xed9d0a03}
  {0x08064000 0xf020fd6d}
  {0x08068000 0x28044780}
  {0x0806c000 0x4604b510}
  {0x08070000 0xf7d82002}
  {0x08074000 0xfef2f7af}
  {0x08078000 0x2228d01d}
  {0x0807c000 0xfb4cf79c}
  {0x08080000 0xe00186c8}
  {0x08084000 0x74696e69}
  {0x08088000 0x00000000}
  {0x0808c000 0x00000065}
}
set bad 0
foreach p $pairs {
    set addr [lindex $p 0]
    set exp  [lindex $p 1]
    if {[catch {
        mem2array m 32 $addr 1
        if {$m(0) != $exp} {
            incr bad
            echo [format "  MISMATCH @0x%08x: got=0x%08x exp=0x%08x" $addr $m(0) $exp]
        }
    } e]} { echo [format "  READ ERR @0x%08x: %s" $addr $e]; incr bad }
}
if {$bad == 0} {
    echo ">>> INTEGRITY OK: all 30 points = factory. Flash clean -> the cause is hardware/conditions."
} else {
    echo [format ">>> FOUND %d mismatches — there is non-factory code outside the 4 regions." $bad]
}
resume
echo "--- integrity check done ---"
shutdown
