adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
# DBGMCU: заморозить IWDG+WWDG на halt. ПРЯМАЯ форма — [expr]-вариант как VALUE
# для mww падает usage-ошибкой на openocd 0.10 (роняло рекавери ДО стирания).
mww 0xE0042004 0x00000300
mww 0x40022044 0x45670123
mww 0x40022044 0xCDEF89AB
# стереть payload-страницу -> 0xFF (== дамп)
mww 0x40022050 0x00000002; mww 0x40022054 0x08090000; mww 0x40022050 0x00000042
sleep 150
mww 0x40022050 0x00000000
# стереть CRC-страницу и записать ОРИГИНАЛЬНЫЙ CRC 0x0f69a878
mww 0x40022050 0x00000002; mww 0x40022054 0x080ffffc; mww 0x40022050 0x00000042
sleep 150
mww 0x40022050 0x00000000
mww 0x40022050 0x00000001
mwh 0x080ffffc 0xa878; sleep 8
mwh 0x080ffffe 0x0f69; sleep 8
mww 0x40022050 0x00000000
mww 0x40022050 0x00000080
echo "RECOVERY-FIX-DONE"
resume
shutdown
