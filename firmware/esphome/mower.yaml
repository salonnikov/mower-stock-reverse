# ⚠️ DEPRECATED as the "brain". ESPHome does NOT handle the wire-receive matched filter
# and real-time motor control (see docs/05 §E). The real brain is the custom
# C++ firmware: firmware/README.md + firmware/src/main.cpp.
# This file is kept ONLY as a quick telemetry stand (read-only) while the
# C++ firmware is being written: to view the battery/currents/sensors in HA without connecting to motors.
#
# ESP32 telemetry stand for VILLARTEC MI 302 — ESPHome (read-only)
# ATTENTION: GPIO numbers are PLACEHOLDERS. Fill in after phase 0 per signal-map.md.
# Flash: esphome run mower.yaml  (in a container!)
#
# Section enablement modes:
#   - Phase 1: sensor + binary_sensor (read-only telemetry)
#   - Phase 2: switch (E-stop, buttons), button, local E-stop in interval
#   - Phase 3: uart + gps + geofence/anti-theft
# Safe defaults: E-stop NOT active by default (blade allowed only when safe_ok).

substitutions:
  device_name: mower-mi302
  geofence_lat: "55.751244"     # plot center (station) — replace
  geofence_lon: "37.618423"     # replace
  geofence_radius_m: "50"       # geofence radius, m

esphome:
  name: ${device_name}
  comment: "Smart brains for VILLARTEC MI 302"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

# ---- Connectivity: Wi-Fi + MQTT (topic contract see docs/01-architecture.md) ----
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                      # fallback AP for field configuration
    ssid: "${device_name}-setup"

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: mower/mi302
  birth_message:
    topic: mower/mi302/availability
    payload: online
  will_message:            # LWT: robot gone → server immediately sees offline
    topic: mower/mi302/availability
    payload: offline
  on_message:              # server commands → emulate the stock buttons
    - topic: mower/mi302/cmd/start
      then:
        - lambda: 'id(theft_armed) = false;'
        - output.turn_on: out_btn_start
        - delay: 200ms
        - output.turn_off: out_btn_start
    - topic: mower/mi302/cmd/stop
      then:
        - output.turn_on: out_btn_stop
        - delay: 200ms
        - output.turn_off: out_btn_stop
    - topic: mower/mi302/cmd/home
      then:
        - output.turn_on: out_btn_home
        - delay: 200ms
        - output.turn_off: out_btn_home
    - topic: mower/mi302/cmd/estop
      then:
        - lambda: 'id(safe_ok) = false;'
        - output.turn_off: out_blade_enable

# ---- Global state flags ----
globals:
  - id: safe_ok            # true = blade allowed to spin
    type: bool
    restore_value: no
    initial_value: "false"
  - id: theft_armed        # anti-theft armed (robot not at the station and not mowing by command)
    type: bool
    restore_value: no
    initial_value: "true"

# ---- I2C for INA226 (battery current/voltage) ----
i2c:
  sda: GPIO21              # PLACEHOLDER
  scl: GPIO22              # PLACEHOLDER
  scan: true

# ======================= PHASE 1: TELEMETRY =======================
sensor:
  - platform: ina226
    address: 0x40
    shunt_resistance: 0.002 ohm     # tune to the shunt/module
    max_current: 10 A
    bus_voltage:
      name: "Battery Voltage"
      id: batt_voltage
      state_topic: mower/mi302/battery/voltage
      filters: [throttle: 10s]
    current:
      name: "Battery Current"
      id: batt_current
      state_topic: mower/mi302/battery/current
      filters: [throttle: 1s]
    power:
      name: "Battery Power"

  # charge % from 5S Li-ion voltage (roughly: 21.0V=100%, 15.0V=0%) — refine via discharge
  - platform: template
    name: "Battery Percent"
    state_topic: mower/mi302/battery/percent
    unit_of_measurement: "%"
    update_interval: 10s
    lambda: |-
      float v = id(batt_voltage).state;
      float p = (v - 15.0) / (21.0 - 15.0) * 100.0;
      if (p < 0) p = 0; if (p > 100) p = 100;
      return p;

  - platform: wifi_signal
    name: "WiFi RSSI"
    state_topic: mower/mi302/wifi/rssi
    update_interval: 30s

  # --- PHASE 3: GPS (uncomment after installing the module) ---
  # - platform: gps
  #   latitude:  { name: "GPS Lat", id: gps_lat }
  #   longitude: { name: "GPS Lon", id: gps_lon }
  #   satellites: { name: "GPS Sats" }
  #   speed: { name: "GPS Speed", id: gps_speed }

binary_sensor:
  - platform: gpio
    name: "Rain"
    id: s_rain
    pin: { number: GPIO34, mode: INPUT }      # PLACEHOLDER (inputs 34-39 have no pull-up)
    state_topic: mower/mi302/sensors/rain
  - platform: gpio
    name: "Lift"
    id: s_lift
    pin: { number: GPIO35, mode: INPUT }      # PLACEHOLDER
    state_topic: mower/mi302/sensors/lift
  - platform: gpio
    name: "Tilt"
    id: s_tilt
    pin: { number: GPIO32, mode: INPUT }      # PLACEHOLDER
    state_topic: mower/mi302/sensors/tilt
  - platform: gpio
    name: "Bump"
    id: s_bump
    pin: { number: GPIO33, mode: INPUT }      # PLACEHOLDER
    state_topic: mower/mi302/sensors/bump
  - platform: gpio
    name: "Perimeter Inside"                  # from the receiver comparator output
    id: s_perimeter
    pin: { number: GPIO25, mode: INPUT }      # PLACEHOLDER
    state_topic: mower/mi302/perimeter/inside

# ======================= PHASE 2: CONTROL =======================
# Outputs to opto-relays/MOSFETs emulating the stock buttons (short to GND).
output:
  - platform: gpio
    id: out_blade_enable        # blade E-stop: HIGH=allowed, LOW=off (fail-safe)
    pin: GPIO26                 # PLACEHOLDER
  - platform: gpio
    id: out_btn_start
    pin: GPIO27                 # PLACEHOLDER
  - platform: gpio
    id: out_btn_stop
    pin: GPIO14                 # PLACEHOLDER
  - platform: gpio
    id: out_btn_home
    pin: GPIO12                 # PLACEHOLDER

button:
  - platform: template
    name: "Start"
    on_press:
      - lambda: 'id(theft_armed) = false;'    # start by command = not theft
      - output.turn_on: out_btn_start
      - delay: 200ms
      - output.turn_off: out_btn_start
  - platform: template
    name: "Stop"
    on_press:
      - output.turn_on: out_btn_stop
      - delay: 200ms
      - output.turn_off: out_btn_stop
  - platform: template
    name: "Home"
    on_press:
      - output.turn_on: out_btn_home
      - delay: 200ms
      - output.turn_off: out_btn_home
  - platform: template
    name: "E-STOP"
    on_press:
      - lambda: 'id(safe_ok) = false;'
      - output.turn_off: out_blade_enable

# (cmd/* commands are handled in the main mqtt: → on_message block, above.)

# ======================= SAFETY + ANTI-THEFT =======================
# Local loop: does NOT depend on Wi-Fi/server. Decides on blade and theft itself.
interval:
  - interval: 200ms
    then:
      - lambda: |-
          // --- Local blade E-stop (fail-safe) ---
          bool danger = id(s_lift).state || id(s_tilt).state;
          // hook up blade overcurrent when there is a separate INA on the blade:
          // danger = danger || (id(blade_current).state > BLADE_MAX_A);
          if (danger) {
            id(safe_ok) = false;
            id(out_blade_enable).turn_off();
          } else {
            id(safe_ok) = true;
            // turn the blade on only if the stock logic also agrees — here we just allow power
            id(out_blade_enable).turn_on();
          }

  - interval: 1s
    then:
      - mqtt.publish:
          topic: mower/mi302/state
          payload: !lambda |-
            if (id(s_lift).state) return "lifted";
            if (id(batt_current).state < -0.2) return "charging";  // current flows into the battery
            if (id(batt_current).state > 0.5)  return "mowing";
            return "idle";

