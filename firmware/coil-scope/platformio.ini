; coil-scope — "an oscilloscope out of an ESP32": we watch the native perimeter-wire signal.
; Twisted-pair coil → GPIO36 (ADC1). Power — a power bank over USB.
; The web UI shows the waveform + spectrum (FFT), frequency/amplitude go to MQTT.
; Build — in a container (runtimes not on the host):
;   docker run --rm -v $PWD:/p -w /p infinitecoding/platformio-for-vscode pio run -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  kosme/arduinoFFT @ ^2
