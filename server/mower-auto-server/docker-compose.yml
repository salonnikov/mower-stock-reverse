# mower-auto orchestrator: automatic dump + sniff.
# Runs ANYWHERE (VPS or home network) — the ESP dials in here itself.
#   docker compose up -d        # start
#   docker compose logs -f      # watch progress (dump/verdict)
# Files: ./out/mower-esp-<date>.bin (dump), ./out/sniff.log (sniff).
#
# If you deploy it on a HOME network — set this machine's IP in the firmware's secrets.h
# (SRV_HOST) and reflash the ESP. If on the user's VPS (default) — change nothing.

services:
  orchestrator:
    image: python:3.12-slim
    container_name: mower-orchestrator
    restart: unless-stopped
    ports:
      - "7777:7777"   # data (UART bridge)
      - "7778:7778"   # control (P)
      - "8080:8080"   # web dashboard
    environment:
      - DATA_PORT=7777
      - CTRL_PORT=7778
      - WEB_PORT=8080
      - OUT=/out
    volumes:
      - ./out:/out
      - ./orchestrator.py:/orchestrator.py:ro
    command: bash -lc "pip install -q esptool && python /orchestrator.py"
