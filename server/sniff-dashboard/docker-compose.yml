# Sniffer dashboard: receives the ESP stream (:9000) + status web page (:8080).
# stdlib only, no pip. Runs on a VPS (or locally).
#   docker compose up -d   ->   http://<host>:8080/
services:
  sniff-dashboard:
    image: python:3.12-slim
    container_name: mower-sniff-dashboard
    restart: unless-stopped
    ports:
      - "9000:9000"   # stream from ESP
      - "8080:8080"   # web dashboard
    environment:
      - DATA_PORT=9000
      - WEB_PORT=8080
      - OUT=/out
    volumes:
      - ./out:/out
      - ./dashboard.py:/dashboard.py:ro
    command: python /dashboard.py
