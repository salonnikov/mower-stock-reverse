# You ALREADY have Home Assistant — we do NOT bring up a separate HA.
# Only the MQTT broker is kept here, and even that is optional:
#   - If HA already has the "Mosquitto broker" add-on — this file is not needed at all,
#     just use the built-in broker (port 1883 on the HA host).
#   - If HA runs in Docker (not HAOS) and there is no broker — bring up Mosquitto from here:
#       cd server && docker compose up -d
#
# The robot connection is described in SETUP.md (this directory).

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mower-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"          # MQTT
      - "9001:9001"          # MQTT over WebSocket (for a future PWA)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
