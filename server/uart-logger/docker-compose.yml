# Logger container: listens on TCP :9000 and writes the whole sniffer stream to a file.
# Run it on machine 192.168.10.66 (the one set as LOG_HOST in the sniffer's secrets.h).
#   cd server/uart-logger && docker compose up -d
#   log: ./logs/mower-uart.log  (lines like "A <millis> <hex>" / "B <millis> <hex>")

services:
  uart-logger:
    image: alpine/socat
    container_name: mower-uart-logger
    restart: unless-stopped
    ports:
      - "9000:9000"
    command: -u TCP-LISTEN:9000,reuseaddr,fork OPEN:/logs/mower-uart.log,creat,append
    volumes:
      - ./logs:/logs
