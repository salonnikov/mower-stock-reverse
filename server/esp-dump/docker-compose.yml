# Automatic dump of the mower's ESP32 firmware (via the mower-link bridge, BRIDGE mode).
# No USB needed — everything over the network. read_flash = read-only, does not break the mower.
#
# Run on a home laptop:
#   BRIDGE_IP=<ip-mower-link> docker compose run --rm dump
#   (the bridge ip is shown on the mower-link page; port 3333 by default)
# Result: ./out/mower-esp-<date>.bin  + verdict "normal/encrypted".

services:
  dump:
    image: python:3.12-slim
    environment:
      - BRIDGE_IP=${BRIDGE_IP:-192.168.10.77}
      - BRIDGE_PORT=${BRIDGE_PORT:-3333}
    volumes:
      - ./out:/out
      - ./dump.sh:/dump.sh:ro
    command: bash /dump.sh
