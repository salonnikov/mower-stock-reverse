# Mosquitto — starter configuration (harden before exposing it externally!)
listener 1883
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# For debugging — anonymous. FOR PRODUCTION: allow_anonymous false + password_file + TLS.
allow_anonymous true
# password_file /mosquitto/config/passwd
