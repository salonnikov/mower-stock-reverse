# Weather-based auto mowing schedule (phase 4).
# Enable in configuration.yaml:  automation: !include automations-weather.yaml
# Idea: mow on schedule, BUT skip rain/wet grass/night.

# 1) Scheduled run: weekdays at 10:00, if dry and the battery is charged
- id: mower_scheduled_start
  alias: "Mower: scheduled start (if dry)"
  trigger:
    - platform: time
      at: "10:00:00"
  condition:
    - condition: state
      entity_id: binary_sensor.mower_mi302_rain      # no rain right now
      state: "off"
    - condition: numeric_state
      entity_id: sensor.mower_mi302_battery_percent
      above: 80
    # forecast: no rain expected in the coming hours (weather.* — your provider)
    - condition: template
      value_template: >
        {{ state_attr('weather.home','forecast')[0].precipitation | float(0) < 0.5 }}
  action:
    - service: button.press
      target: { entity_id: button.mower_mi302_start }

# 2) Rain started during mowing → go home
- id: mower_rain_go_home
  alias: "Mower: rain → home"
  trigger:
    - platform: state
      entity_id: binary_sensor.mower_mi302_rain
      to: "on"
  condition:
    - condition: state
      entity_id: sensor.mower_mi302_state
      state: "mowing"
  action:
    - service: button.press
      target: { entity_id: button.mower_mi302_home }

# 3) Anti-theft: alarm → push to phone + coordinate log
- id: mower_theft_alarm
  alias: "Mower: anti-theft"
  trigger:
    - platform: mqtt
      topic: mower/mi302/alarm/theft
  action:
    - service: notify.mobile_app          # HA companion app
      data:
        title: "🚨 The lawn mower is being taken!"
        message: >
          Anti-theft triggered ({{ trigger.payload_json.reason }}).
          Coordinates: {{ trigger.payload_json.lat }}, {{ trigger.payload_json.lon }}
        data:
          url: "https://maps.google.com/?q={{ trigger.payload_json.lat }},{{ trigger.payload_json.lon }}"

# 4) Low charge (just in case the stock logic did not return it)
- id: mower_low_batt_home
  alias: "Mower: low charge → home"
  trigger:
    - platform: numeric_state
      entity_id: sensor.mower_mi302_battery_percent
      below: 20
  condition:
    - condition: state
      entity_id: sensor.mower_mi302_state
      state: "mowing"
  action:
    - service: button.press
      target: { entity_id: button.mower_mi302_home }
