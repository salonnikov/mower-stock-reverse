# PROOF v2 — метод PG-один-раз-на-страницу (проверенный: дал корректный 0xA5A5).
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
mem2array cr 32 0xE0042004 1
mww 0xE0042004 [expr {$cr(0) | 0x300}]
mww 0x40022044 0x45670123
mww 0x40022044 0xCDEF89AB

# --- payload page 0x08090000 ---
mww 0x40022050 0x00000002; mww 0x40022054 0x08090000; mww 0x40022050 0x00000042
sleep 120
mww 0x40022050 0x00000000
mww 0x40022050 0x00000001
mwh 0x08090000 0x3344; sleep 6
mwh 0x08090002 0x1122; sleep 6
mwh 0x08090004 0x7788; sleep 6
mwh 0x08090006 0x5566; sleep 6
mwh 0x08090008 0xbbcc; sleep 6
mwh 0x0809000a 0x99aa; sleep 6
mwh 0x0809000c 0xff00; sleep 6
mwh 0x0809000e 0xddee; sleep 6
mww 0x40022050 0x00000000

# --- CRC page (0x080ffffc) ---
mww 0x40022050 0x00000002; mww 0x40022054 0x080ffffc; mww 0x40022050 0x00000042
sleep 120
mww 0x40022050 0x00000000
mww 0x40022050 0x00000001
mwh 0x080ffffc 0x43f2; sleep 6
mwh 0x080ffffe 0xc82f; sleep 6
mww 0x40022050 0x00000000

mww 0x40022050 0x00000080
resume
shutdown
