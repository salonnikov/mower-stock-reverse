# A3-bank1 — доказать запись в ВЕРХНИЙ банк GD32 через его FMC-регистры напрямую
# (openocd stm32f1x не умеет bank1). Пишет 0xA5A5 x4 в свободный 0x080F0000,
# verify, стирает обратно. Кода приложения НЕ касается. halt + watchdog-freeze.
# FMC bank1 (из вендорного SVD): KEY1=0x40022044 STAT1=0x4002204C CTL1=0x40022050 ADDR1=0x40022054
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
# заморозить watchdog на halt
mem2array cr 32 0xE0042004 1
mww 0xE0042004 [expr {$cr(0) | 0x300}]

echo "=== BEFORE 0x080F0000 (ждём ffffffff) ==="
mdw 0x080F0000 2

# разблокировать bank1
mww 0x40022044 0x45670123
mww 0x40022044 0xCDEF89AB
echo "=== CTL1 после unlock (bit7 LK должен стать 0) ==="
mdw 0x40022050 1

# стереть страницу 0x080F0000 (PER|START)
mww 0x40022050 0x00000002
mww 0x40022054 0x080F0000
mww 0x40022050 0x00000042
sleep 80
mww 0x40022050 0x00000000
echo "=== STAT1 после erase (bit0 BUSY=0, bit5 END) ==="
mdw 0x4002204C 1
echo "=== AFTER ERASE (ждём ffffffff) ==="
mdw 0x080F0000 2

# программировать 4 полуслова 0xA5A5 (PG)
mww 0x40022050 0x00000001
mwh 0x080F0000 0xA5A5
sleep 5
mwh 0x080F0002 0xA5A5
sleep 5
mwh 0x080F0004 0xA5A5
sleep 5
mwh 0x080F0006 0xA5A5
sleep 5
mww 0x40022050 0x00000000
echo "=== STAT1 после write ==="
mdw 0x4002204C 1
echo "=== AFTER WRITE (ждём a5a5a5a5 a5a5a5a5) ==="
mdw 0x080F0000 2

# стереть обратно
mww 0x40022050 0x00000002
mww 0x40022054 0x080F0000
mww 0x40022050 0x00000042
sleep 80
mww 0x40022050 0x00000000
echo "=== AFTER ERASE-BACK (ждём ffffffff) ==="
mdw 0x080F0000 2

# заблокировать bank1
mww 0x40022050 0x00000080
reset run
shutdown
