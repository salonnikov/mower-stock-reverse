# bank1 write v2 — корректная FMC-последовательность с опросом BUSY (STAT1 bit0).
# Пишет распознаваемый паттерн в свободный 0x080F0000, resume (без reset).
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
gdb_port disabled
tcl_port disabled
telnet_port disabled

proc b1_busy {} { mem2array s 32 0x4002204C 1; return [expr {$s(0) & 1}] }
proc b1_pgm16 {addr val} {
  mww 0x40022050 0x00000001
  mwh $addr $val
  set n 0
  while {[b1_busy] && $n < 1000} { incr n }
  mww 0x40022050 0x00000000
}

init
halt
mem2array cr 32 0xE0042004 1
mww 0xE0042004 [expr {$cr(0) | 0x300}]

# unlock bank1
mww 0x40022044 0x45670123
mww 0x40022044 0xCDEF89AB

# erase page 0x080F0000 (PER|START) + busy-wait
mww 0x40022050 0x00000002
mww 0x40022054 0x080F0000
mww 0x40022050 0x00000042
set n 0
while {[b1_busy] && $n < 100000} { incr n }
mww 0x40022050 0x00000000

# program pattern (halfword-by-halfword, busy-wait each)
b1_pgm16 0x080F0000 0x1234
b1_pgm16 0x080F0002 0x5678
b1_pgm16 0x080F0004 0x9abc
b1_pgm16 0x080F0006 0xdef0

# lock, resume (без reset run — дисплей не рушим)
mww 0x40022050 0x00000080
resume
shutdown
