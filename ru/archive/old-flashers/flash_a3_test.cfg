# A3 — доказать цикл erase+program+verify во ФЛЕШ, только свободный регион 0x080F0000.
# Пишет 0xA5 x256, verify, стирает обратно в 0xFF, verify. Кода приложения НЕ касается.
# Запускается ВМЕСТО poll.cfg (poll.cfg остановлен на время A3).
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap -work-area-phys 0x20000000 -work-area-size 0x2000 -work-area-backup 0
# GD32 отдаёт ST-совместимый id (0x418) → autodetect даёт 256К. Флеш реально 1М
# (код до ~0x08085000, дамп до 0x080ffff0) → размер задаём ЯВНО 0x100000.
flash bank chip.flash stm32f1x 0x08000000 0x100000 0 0 chip.cpu
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
# заморозить watchdog на время halt (иначе IWDG/WWDG сбрасывает чип) — DBGMCU_CR |0x300
mem2array cr 32 0xE0042004 1
mww 0xE0042004 [expr {$cr(0) | 0x300}]
echo "=== PROTECTION (read-only): FMC_OBSTAT/RDP 0x4002201C, FMC_WP 0x40022020 ==="
mdw 0x4002201C 1
mdw 0x40022020 1
echo "    (FMC_WP=ffffffff => нет write-protect; OBSTAT bit1=SPC/RDP)"
echo "=== PROBE ==="
flash probe 0
echo "=== BEFORE 0x080F0000 (ждём ffffffff) ==="
mdw 0x080F0000 4
echo "=== FILL 0xA5 x256 ==="
flash fillb 0x080F0000 0xA5 256
echo "=== AFTER-WRITE (ждём a5a5a5a5) ==="
mdw 0x080F0000 4
echo "=== ERASE BACK ==="
flash erase_address 0x080F0000 0x800
echo "=== AFTER-ERASE (ждём ffffffff) ==="
mdw 0x080F0000 4
# чистый ребут (work-area затёр RAM; reset run = чистый старт, попросит PIN)
reset run
shutdown
