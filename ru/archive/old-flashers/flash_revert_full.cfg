# flash_revert_full.cfg — ОТКАТ на завод: восстановить весь стоковый дамп через
# openocd flash-драйвер (RAM-loader, быстро; вручную 1МБ нереально).
# Требует, чтобы PRE-FLIGHT B прошёл (openocd flash видит весь 1МБ, тянет bank1).
# Дамп должен лежать на малине: /tmp/gd32-mainboard-dump-v1.bin
adapter driver bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 146203 36
bcm2835gpio_swd_nums 25 24
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap -work-area-phys 0x20000000 -work-area-size 0x2000 -work-area-backup 0
set _FLASHNAME chip.flash
flash bank $_FLASHNAME stm32f1x 0x08000000 0x100000 0 0 chip.cpu
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
# заморозить wdg на время долгой записи
mem2array cr 32 0xE0042004 1
mww 0xE0042004 [expr {$cr(0) | 0x300}]
mww 0xE0042004 0x00000300
flash probe 0
# восстановить весь стоковый образ (erase+program через RAM-loader)
flash write_image erase /tmp/gd32-mainboard-dump-v1.bin 0x08000000
reset run
shutdown
